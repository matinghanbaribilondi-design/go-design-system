<!doctype html>
<html>
<head><meta charset="utf-8"><title>Plugin UI preview harness</title>
<style>html,body{margin:0;height:100%;background:#ececee;display:grid;place-items:center}iframe{width:920px;height:720px;border:1px solid #bbb;border-radius:10px;background:#fff;box-shadow:0 18px 50px rgba(0,0,0,.14)}</style>
</head>
<body>
<iframe id="frame" src="../ui.html"></iframe>
<script>
const frame = document.getElementById('frame');
const FAIL = location.search.includes('fail');
window.__log = { analyze: 0, generate: 0 };
const reply = (type, data) => frame.contentWindow.postMessage({ pluginMessage: { type, data } }, '*');

const DISCOVER = {
  fileName: 'Acme Product Design',
  pages: [
    { id: 'p1', name: 'Cover', frames: 1, components: 0, recommendation: 'Review' },
    { id: 'p2', name: 'Design System', frames: 4, components: 18, recommendation: 'Recommended' },
    { id: 'p3', name: 'Marketing / Website', frames: 9, components: 6, recommendation: 'Recommended' },
    { id: 'p4', name: 'Explorations', frames: 12, components: 3, recommendation: 'Excluded' }
  ],
  collections: [{ id: 'c1', name: 'Primitives', modes: 2, variables: 64 }, { id: 'c2', name: 'Semantic', modes: 2, variables: 38 }],
  comps: [], counts: { pages: 4, collections: 2, variables: 102, styles: 27, components: 27 },
  saved: null,
  engine: { available: true, id: 'fig-engine', version: '1.0.0', capabilities: ['frame', 'component'] }
};

const FRAMES = { frames: [
  { id: 'f1', name: 'Home', page: 'Marketing / Website', w: 1440, h: 900, instances: 14, recommended: true, excluded: false },
  { id: 'f2', name: 'Pricing', page: 'Marketing / Website', w: 1440, h: 1100, instances: 9, recommended: true, excluded: false },
  { id: 'f3', name: 'Settings', page: 'Design System', w: 390, h: 844, instances: 6, recommended: false, excluded: false },
  { id: 'f4', name: 'Dashboard', page: 'Design System', w: 1280, h: 800, instances: 5, recommended: true, excluded: false }
]};

const SUMMARY = { pages: 2, tokens: 102, deps: 12, components: 27, componentsHtml: 27, styles: 27, screens: 4, icons: 31, refs: 4 };

const FILES = [
  ['SKILL.md', '# Global Design System\n\nRead tokens.css first.'],
  ['design.md', '# Design\n\nRules and inventory.'],
  ['tokens.md', '# Tokens\n\n102 variables.'],
  ['components.md', '# Components\n\n27 components.'],
  ['content.md', '# Content\n\nVoice and tone.'],
  ['ai-control.md', '# AI Control\n\nLevel 3.'],
  ['validation.md', '# Validation\n\n100/100'],
  ['tokens.css', ':root{--color-primary:#111}'],
  ['manifest.json', '{"schemaVersion":1,"engine":"fig-engine@1.0.0"}'],
  ['components.css', '.button{display:inline-flex}'],
  ['components/index.json', '{"components":27}'],
  ['components/button.html', '<!doctype html><html><body><button class="button">Hi</button></body></html>'],
  ['components/input.html', '<!doctype html><html><body><input class="input"></body></html>'],
  ['reference/index.html', '<!doctype html><html><body>index</body></html>'],
  ['reference/home.html', '<!doctype html><html><body>home</body></html>'],
  ['reference/pricing.html', '<!doctype html><html><body>pricing</body></html>'],
  ['reference/settings.html', '<!doctype html><html><body>settings</body></html>'],
  ['reference/dashboard.html', '<!doctype html><html><body>dashboard</body></html>'],
  ['reference/icons.html', '<!doctype html><html><body>icons</body></html>'],
  ['reference/tokens.css', '--ref-only:1;'],
  ['reference/fonts.css', '@font-face{font-family:Inter}']
];

let timer = null;
const clampSize = (w, h) => [Math.min(1400, Math.max(520, Math.round(w) || 920)), Math.min(1400, Math.max(420, Math.round(h) || 720))];
function applySize(w, h, commit) {
  const s = clampSize(w, h);
  frame.style.width = s[0] + 'px'; frame.style.height = s[1] + 'px';
  if (commit) localStorage.setItem('gds-ui-size', JSON.stringify({ w: s[0], h: s[1] }));
}
frame.onload = () => {
  const saved = JSON.parse(localStorage.getItem('gds-ui-size') || 'null');
  if (saved) applySize(saved.w, saved.h);
  setTimeout(() => reply('discover', DISCOVER), 250);
};

window.addEventListener('message', (e) => {
  const m = e.data && e.data.pluginMessage;
  if (!m) return;
  if (m.type === 'discover') { setTimeout(() => reply('discover', DISCOVER), 100); return; }
  if (m.type === 'resize') { applySize(m.w, m.h, m.commit); return; }
  if (m.type === 'frames') { setTimeout(() => reply('frames', FRAMES), 200); return; }
  if (m.type === 'frame-thumb') {
    const fr = FRAMES.frames.find(f => f.id === m.id);
    if (!fr) { reply('frame-thumb', { id: m.id, error: 'Frame is no longer in the file' }); return; }
    if (fr.name === 'Settings') { reply('frame-thumb', { id: m.id, error: 'Simulated preview failure' }); return; }
    const h = Math.round(220 * Math.max(0.75, Math.min(2.5, fr.h / fr.w)));
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="360" height="' + h + '" viewBox="0 0 360 ' + h + '">'
      + '<rect width="360" height="' + h + '" fill="#eef2f7"/>'
      + '<rect x="0" y="0" width="360" height="64" fill="#1f2937"/>'
      + '<circle cx="28" cy="32" r="10" fill="#f9fafb"/>'
      + '<text x="48" y="38" font-family="Arial" font-size="15" fill="#f9fafb">' + fr.name + '</text>'
      + '<rect x="24" y="88" width="200" height="14" rx="7" fill="#94a3b8"/>'
      + '<rect x="24" y="112" width="140" height="9" rx="4" fill="#cbd5e1"/>'
      + '<rect x="24" y="140" width="312" height="' + Math.max(20, h - 168) + '" rx="10" fill="#dbe3ec"/>'
      + '</svg>';
    reply('frame-thumb', { id: m.id, dataUrl: 'data:image/svg+xml,' + encodeURIComponent(svg) });
    return;
  }
  if (m.type === 'analyze') {
    window.__log.analyze++;
    [8, 20, 33, 46, 61, 72, 84, 93, 97].forEach(v => reply('progress', { value: v }));
    if (FAIL) { reply('error', { message: 'Simulated engine failure' }); return; }
    reply('analysis', { summary: SUMMARY, compReport: { ok: 27, failed: [], engine: 'fig-engine@1.0.0' } });
    return;
  }
  if (m.type === 'generate') {
    window.__log.generate++;
    reply('files-begin', { count: FILES.length });
    FILES.forEach(([path, content, binary]) => {
      if (path.endsWith('home.html') && !binary) {
        reply('file-chunk', { path, i: 0, n: 2, part: content.slice(0, 10), binary: false });
        reply('file-chunk', { path, i: 1, n: 2, part: content.slice(10), binary: false });
        return;
      }
      reply('file', { path, content, binary: !!binary });
    });
    reply('files-done', { count: FILES.length });
  }
});
</script>
</body>
</html>
